<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Живая материя</title><link rel="stylesheet" href="brand-fonts.css"><style>*{box-sizing:border-box}body{margin:0;background:#062a5f;color:white;font:16px 'Golos Text',Arial,sans-serif}main{max-width:1250px;margin:auto;padding:24px}nav,.controls{display:flex;gap:10px;flex-wrap:wrap}a{color:#99c2ff}h1{font-size:40px;margin:28px 0 8px}p{color:#99c2ff;line-height:1.6}canvas{width:100%;height:570px;display:block;touch-action:none;cursor:crosshair}button,input{font:inherit;padding:12px 16px;border:1px solid #99c2ff;border-radius:8px;background:#144696;color:white}button{cursor:pointer}button[aria-pressed=true]{background:#99c2ff;color:#062a5f}input{max-width:220px}label{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#status{min-height:24px}small{color:#99c2ff}@media(max-width:500px){main{padding:16px}canvas{height:440px}h1{font-size:30px}}</style><main><nav><a href="./">Галерея</a><a href="canvas-lab.html">Canvas</a><a href="volume-atlas.html">Объёмные фигуры</a></nav><h1>Живая материя</h1><p>1 800 частиц. Одна форма сменяет другую. Нажмите на сцену — материя разлетится и соберётся вновь.</p><div class="controls"><button data-form="galaxy">Галактика</button><button data-form="sphere">Сфера</button><button data-form="vortex">Вихрь</button><button data-form="heart">Сердце</button><button data-form="text">Ваше слово</button><button id="burst">Взрыв</button><button id="pause">Пауза</button></div><canvas aria-label="Трёхмерная анимация 1800 частиц, собирающихся в выбранную фигуру"></canvas><div class="controls"><label>Слово<input id="word" value="ВАУ" maxlength="12" aria-label="Слово из частиц"></label><button id="apply">Собрать слово</button><label><input id="spin" type="checkbox" checked>Вращение</label><label><input id="tour" type="checkbox">Автопоказ</label></div><p id="status" aria-live="polite"></p><small>Canvas 2D, трёхмерная проекция и пружинная физика. Без внешних библиотек. Декоративная сцена, не график данных.</small></main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),N=1800,TAU=Math.PI*2,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let W=0,H=0,form='galaxy',time=0,last=0,yaw=0,playing=!reduced,tourTime=0;
const particles=Array.from({length:N},()=>({x:Math.random()*4-2,y:Math.random()*4-2,z:Math.random()*4-2,vx:0,vy:0,vz:0,tx:0,ty:0,tz:0}));const fract=x=>x-Math.floor(x);
function targets(kind){form=kind;let samples=[];if(kind==='text'){const off=document.createElement('canvas');off.width=800;off.height=180;const g=off.getContext('2d');g.fillStyle='white';g.textAlign='center';g.textBaseline='middle';const word=document.querySelector('#word').value.trim()||'ВАУ';g.font='bold '+Math.min(150,1100/word.length)+'px Arial';g.fillText(word,400,90);const data=g.getImageData(0,0,800,180).data;for(let y=0;y<180;y+=3)for(let x=0;x<800;x+=3)if(data[(y*800+x)*4+3]>100)samples.push({x:(x-400)/230,y:(y-90)/230,z:0})}
particles.forEach((p,i)=>{const u=(i+.5)/N,a=i*2.39996323,b=fract(i*.41421356)*TAU;let x,y,z;if(kind==='galaxy'){const r=Math.sqrt(u)*1.2,angle=i%5*TAU/5+r*5;x=r*Math.cos(angle);z=r*Math.sin(angle);y=.13*Math.sin(a)*(1-r/1.2)}else if(kind==='sphere'){y=1-2*u;const r=Math.sqrt(1-y*y);x=r*Math.cos(a);z=r*Math.sin(a)}else if(kind==='vortex'){const r=.15+.8*u,angle=u*TAU*7;x=r*Math.cos(angle);z=r*Math.sin(angle);y=(u-.5)*2}else if(kind==='heart'){const t=u*TAU;x=16*Math.pow(Math.sin(t),3)/18;y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/18;z=.23*Math.sin(b)*Math.sin(t)}else{const s=samples[i%samples.length]||{x:0,y:0,z:0};x=s.x;y=s.y;z=(fract(i*.618)-.5)*.12}p.tx=x;p.ty=y;p.tz=z;if(reduced){p.x=x;p.y=y;p.z=z}});document.querySelectorAll('[data-form]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.form===kind));document.querySelector('#status').textContent=({galaxy:'Пять рукавов вокруг общего центра',sphere:'Оболочка из светящихся частиц',vortex:'Спираль движения в глубину',heart:'Объёмное сердце',text:'Ваше слово из частиц'})[kind]}
function burst(cx=0,cy=0){particles.forEach(p=>{const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy,p.z)+.15;p.vx+=dx/d*3+(Math.random()-.5);p.vy+=dy/d*3+(Math.random()-.5);p.vz+=p.z/d*3+(Math.random()-.5)})}
function draw(t){const dt=playing?Math.min(.033,(t-last)/1000)||0:0;last=t;time+=dt;if(playing&&document.querySelector('#spin').checked&&form!=='text')yaw+=dt*.17;if(document.querySelector('#tour').checked&&playing){tourTime+=dt;if(tourTime>7){tourTime=0;const forms=['galaxy','sphere','vortex','heart','text'];targets(forms[(forms.indexOf(form)+1)%forms.length])}}const box=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=box.width;H=box.height;if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#062a5f';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';const scale=Math.min(W/3.8,H/3);const sorted=[];particles.forEach((p,i)=>{p.vx+=(p.tx-p.x)*dt*12;p.vy+=(p.ty-p.y)*dt*12;p.vz+=(p.tz-p.z)*dt*12;const friction=Math.exp(-dt*4);p.vx*=friction;p.vy*=friction;p.vz*=friction;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;const angle=form==='text'?0:yaw,x=p.x*Math.cos(angle)+p.z*Math.sin(angle),z=-p.x*Math.sin(angle)+p.z*Math.cos(angle),k=3.5/Math.max(.5,3.5-z);sorted.push({x:W/2+x*scale*k,y:H/2+p.y*scale*k,k,z,i})});sorted.sort((a,b)=>a.z-b.z).forEach(p=>{const pulse=.7+.3*Math.sin(time*2+p.i*.3),r=Math.min(5,1.1*p.k),alpha=Math.min(1,.3+p.k*.35)*pulse;ctx.globalAlpha=alpha*.12;ctx.fillStyle=p.i%4?'#99c2ff':'#98a8f8';ctx.beginPath();ctx.arc(p.x,p.y,r*4,0,TAU);ctx.fill();ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill()});ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw)}
document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>targets(b.dataset.form));document.querySelector('#apply').onclick=()=>targets('text');document.querySelector('#burst').onclick=()=>burst();document.querySelector('#pause').textContent=playing?'Пауза':'Продолжить';document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'Пауза':'Продолжить'};c.onpointerdown=e=>{const b=c.getBoundingClientRect(),s=Math.min(W/3.8,H/3);burst((e.clientX-b.left-W/2)/s,(e.clientY-b.top-H/2)/s)};targets(form);requestAnimationFrame(draw);
</script></html>
