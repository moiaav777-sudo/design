<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Саша и Юля</title><style>*{box-sizing:border-box}body{margin:0;background:#030817;color:#dcecff;font-family:Arial,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}#cover{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#102454,#030817 65%);z-index:2}#cover[hidden]{display:none}#start{width:100px;height:100px;border:1px solid #99c2ff;border-radius:50%;background:#102454;color:#fff;cursor:pointer;box-shadow:0 0 25px #5eeaff88,inset 0 0 20px #5eeaff33;display:grid;place-items:center}#start:focus-visible{outline:4px solid #99c2ff;outline-offset:6px}.triangle{width:0;height:0;border-top:16px solid transparent;border-bottom:16px solid transparent;border-left:25px solid white;margin-left:7px}@media(prefers-reduced-motion:reduce){#start{box-shadow:none}}</style></head><body><div id="cover"><button id="start" aria-label="Запустить композицию"><span class="triangle" aria-hidden="true"></span></button></div><canvas aria-label="Красное сердце, имена Саша и Юля и мерцающая сфера"></canvas><div hidden><h1></h1><p></p><small></small><nav><a></a></nav><button data-form="names"></button><input id="word" value="Саша Юля"><button id="apply"></button><button id="burst"></button><button id="pause"></button><input id="spin" type="checkbox"><input id="tour" type="checkbox"><div id="status"></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),N=1800,TAU=Math.PI*2,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let namesStart=0;let W=0,H=0,form='names',time=0,last=0,yaw=0,playing=false,tourTime=0;
const particles=Array.from({length:N},()=>({x:Math.random()*4-2,y:Math.random()*4-2,z:Math.random()*4-2,vx:0,vy:0,vz:0,tx:0,ty:0,tz:0}));const fract=x=>x-Math.floor(x);
function targets(kind){form=kind;if(kind==='names')namesStart=time;let samples=[];if(kind==='text'||kind==='names'){const off=document.createElement('canvas');off.width=800;off.height=300;const g=off.getContext('2d');g.fillStyle='white';g.textAlign='center';g.textBaseline='middle';const word=kind==='names'?'Саша + Юля':document.querySelector('#word').value.trim()||'ВАУ';g.font='bold '+Math.min(150,1100/word.length)+'px Arial';g.fillText(word,400,150);const data=g.getImageData(0,0,800,300).data;for(let y=0;y<300;y+=3)for(let x=0;x<800;x+=3)if(data[(y*800+x)*4+3]>100)samples.push({x:(x-400)/230,y:(y-150)/230,z:0})}
document.body.style.background='#030817';document.body.style.color=(kind==='heart'||kind==='names')?'#232832':'#ffffff';document.querySelector('h1').style.color=(kind==='heart'||kind==='names')?'#062a5f':'#ffffff';document.querySelectorAll('p,small,nav a').forEach(e=>e.style.color=(kind==='heart'||kind==='names')?'#414b5f':'#99c2ff');particles.forEach((p,i)=>{const u=(i+.5)/N,a=i*2.39996323,b=fract(i*.41421356)*TAU;let x,y,z;if(kind==='galaxy'){const r=Math.sqrt(u)*1.2,angle=i%5*TAU/5+r*5;x=r*Math.cos(angle);z=r*Math.sin(angle);y=.13*Math.sin(a)*(1-r/1.2)}else if(kind==='sphere'){y=1-2*u;const r=Math.sqrt(1-y*y);x=r*Math.cos(a);z=r*Math.sin(a)}else if(kind==='vortex'){const r=.15+.8*u,angle=u*TAU*7;x=r*Math.cos(angle);z=r*Math.sin(angle);y=(u-.5)*2}else if(kind==='heart'){const t=u*TAU;x=16*Math.pow(Math.sin(t),3)/18;y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/18;z=.23*Math.sin(b)*Math.sin(t)}else{const s=samples[Math.min(samples.length-1,Math.floor(i/N*samples.length))]||{x:0,y:0,z:0};x=s.x*(kind==='names'?.65:1);y=s.y*(kind==='names'?.65:1);z=(fract(i*.618)-.5)*.12}p.tx=x;p.ty=y;p.tz=z;if(kind==='names'){const side=x<0?-1:1;p.x=side*(2.7+fract(i*.137)*1.6);p.y=Math.sin(i*.73)*2;p.z=Math.cos(i*.73)*2;p.vx=p.vy=p.vz=0;}if(reduced){p.x=x;p.y=y;p.z=z}});document.querySelectorAll('[data-form]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.form===kind));document.querySelector('#status').textContent=({galaxy:'Пять рукавов вокруг общего центра',sphere:'Оболочка из светящихся частиц',vortex:'Спираль движения в глубину',heart:'Объёмное сердце',text:'Ваше слово из частиц',names:'Саша и Юля — два вихря на фоне сердца'})[kind]}
function burst(cx=0,cy=0){particles.forEach(p=>{const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy,p.z)+.15;p.vx+=dx/d*3+(Math.random()-.5);p.vy+=dy/d*3+(Math.random()-.5);p.vz+=p.z/d*3+(Math.random()-.5)})}
function draw(t){const dt=playing?Math.min(.033,(t-last)/1000)||0:0;last=t;time+=dt;if(playing&&document.querySelector('#spin').checked&&form!=='text'&&form!=='names')yaw+=dt*.17;if(document.querySelector('#tour').checked&&playing){tourTime+=dt;if(tourTime>7){tourTime=0;const forms=['galaxy','sphere','vortex','heart','text'];targets(forms[(forms.indexOf(form)+1)%forms.length])}}const box=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=box.width;H=box.height;if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#030817';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';const scale=Math.min(W/3.8,H/3);if(form==='names'){drawUnion(scale,false);drawHeartBackdrop(scale);}const sorted=[];particles.forEach((p,i)=>{if(form==='names'){const age=Math.max(0,time-namesStart),phase=Math.max(0,1-age/4.5),side=p.tx<0?-1:1,angle=age*4.5+i*.17,r=phase*(1.3+fract(i*.31));const gx=p.tx+side*phase*2.5,gy=p.ty+Math.sin(angle)*r,gz=p.tz+Math.cos(angle)*r;p.vx+=(gx-p.x)*dt*12;p.vy+=(gy-p.y)*dt*12;p.vz+=(gz-p.z)*dt*12;}else{p.vx+=(p.tx-p.x)*dt*12;p.vy+=(p.ty-p.y)*dt*12;p.vz+=(p.tz-p.z)*dt*12;}const friction=Math.exp(-dt*4);p.vx*=friction;p.vy*=friction;p.vz*=friction;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;const angle=(form==='text'||form==='names')?0:yaw,x=p.x*Math.cos(angle)+p.z*Math.sin(angle),z=-p.x*Math.sin(angle)+p.z*Math.cos(angle),k=3.5/Math.max(.5,3.5-z);sorted.push({x:W/2+x*scale*k,y:H/2+p.y*scale*k,k,z,i})});sorted.sort((a,b)=>a.z-b.z).forEach(p=>{const pulse=.7+.3*Math.sin(time*2+p.i*.3),r=Math.min(5,1.1*p.k),alpha=Math.min(1,.3+p.k*.35)*pulse;ctx.shadowBlur=5;ctx.shadowColor='#65eaff';ctx.globalAlpha=alpha*.18;ctx.fillStyle=form==='names'?'#77efff':form==='heart'?'#ff448c':p.i%4?'#99c2ff':'#98a8f8';ctx.beginPath();ctx.arc(p.x,p.y,r*4,0,TAU);ctx.fill();ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill()});ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';if(form==='names')drawUnion(scale,true);requestAnimationFrame(draw)}
// Финальная оболочка: противоположные вихри постепенно сходятся в сферу.
const unionPoints=Array.from({length:700},(_,i)=>{const y=1-2*(i+.5)/700,r=Math.sqrt(1-y*y),a=i*2.39996323;return{x:r*Math.cos(a),y,z:r*Math.sin(a),i}});
function drawUnion(scale,front){
 if(form!=='names')return;
 const elapsed=time-namesStart,progress=Math.max(0,Math.min(1,(elapsed-5.5)/4));
 if(progress<=0)return;
 const ease=progress*progress*(3-2*progress),radius=1.4,spin=time*.12;
 ctx.save();ctx.globalCompositeOperation='source-over';
 unionPoints.forEach(p=>{const side=p.i%2?1:-1,angle=(1-ease)*8*side+spin,xx=p.x*Math.cos(angle)+p.z*Math.sin(angle),zz=-p.x*Math.sin(angle)+p.z*Math.cos(angle),x=xx*radius+side*(1-ease)*2.5,y=p.y*radius+Math.sin(p.i*.2+elapsed*3)*(1-ease)*1.2,z=zz*radius;
 if((z>=0)!==front)return;
 const k=4.8/(4.8-z),sx=W/2+x*scale*k,sy=H/2+y*scale*k,twinkle=.5+.5*Math.sin(time*(1.5+(p.i%7)*.12)+p.i*1.37),alpha=progress*(front?.28:.14)+twinkle*progress*(front?.48:.25);
 ctx.fillStyle='#65eaff';ctx.shadowBlur=9;ctx.shadowColor='#24dfff';ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(sx,sy,(.7+twinkle*1.1)*k,0,Math.PI*2);ctx.fill();if(twinkle>.96){ctx.strokeStyle='#99c2ff';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(sx-3,sy);ctx.lineTo(sx+3,sy);ctx.moveTo(sx,sy-3);ctx.lineTo(sx,sy+3);ctx.stroke()}});
 ctx.restore();

}
// Сердце рисуется позади имён в той же сцене.
function drawHeartBackdrop(scale){
 ctx.save();ctx.globalCompositeOperation='source-over';
 const pulse=1+.025*Math.sin(time*3);
 for(let i=0;i<1100;i++){const t=i/1100*Math.PI*2,spread=(.9+.1*Math.sin(i*2.39996));const x=16*Math.pow(Math.sin(t),3)/18,y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/18;ctx.fillStyle='#ff448c';ctx.shadowBlur=8;ctx.shadowColor='#ff197a';ctx.globalAlpha=.35+.5*(.5+.5*Math.sin(i*.31));ctx.beginPath();ctx.arc(W/2+x*scale*1.25*pulse*spread,H/2+y*scale*1.25*pulse*spread,2,0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>targets(b.dataset.form));document.querySelector('#apply').onclick=()=>targets('text');document.querySelector('#burst').onclick=()=>burst();document.querySelector('#pause').textContent=playing?'Пауза':'Продолжить';document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'Пауза':'Продолжить'};c.onpointerdown=e=>{const b=c.getBoundingClientRect(),s=Math.min(W/3.8,H/3);burst((e.clientX-b.left-W/2)/s,(e.clientY-b.top-H/2)/s)};targets(form);document.querySelector('#start').onclick=()=>{document.querySelector('#cover').hidden=true;playing=true;time=0;namesStart=0;targets('names');};requestAnimationFrame(draw);
</script></body></html>
