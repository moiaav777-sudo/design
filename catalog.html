<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог приёмов</title><link rel="stylesheet" href="brand-fonts.css"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#232832;font:16px 'Golos Text',Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px}a,h1,h2{color:#062a5f}.controls{display:flex;flex-wrap:wrap;gap:14px;margin:24px 0}label{display:grid;gap:8px}input,select,button{font:inherit;padding:10px;border:1px solid #c9ced6;border-radius:8px;background:#fff;color:#062a5f}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid #e5e5e5;border-radius:12px;padding:18px}.card h2{font-size:18px}.card p{line-height:1.5}#detail{border-top:1px solid #c9ced6;margin-top:24px;padding-top:20px}#compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}iframe{width:100%;height:440px;border:1px solid #e5e5e5;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e8eef8;padding:16px}#detail[hidden]{display:none}@media(max-width:600px){#compare{grid-template-columns:1fr}main{padding:16px}}</style><main><a href="./">← Главный дашборд</a><h1>Выбор приёма для презентации</h1><p>Выбирайте по задаче, сравнивайте варианты и проверяйте ограничения формата.</p><p><a href="catalog.json">Каталог JSON для нейросети</a> · <a href="AI-GUIDE.md">Инструкция для нейросети</a></p><div class="controls"><label>Поиск<input id="query" placeholder="Например, число или очередь"></label><label>Задача<select id="task"><option value="">Все задачи</option></select></label><label>Формат<select id="format"><option value="html">HTML — живой интерактив</option><option value="powerpoint">PowerPoint — адаптация</option><option value="pdf">PDF — статичный кадр</option></select></label></div><p id="format-note"></p><p id="count" aria-live="polite"></p><div id="compare"></div><section id="detail" hidden></section><div id="list" class="cards"></div></main><script>
const $=id=>document.getElementById(id);let data,comparison=[];
function show(d){$('detail').hidden=false;$('detail').replaceChildren();const title=document.createElement('h2');title.textContent=d.title;$('detail').append(title);for(const text of [d.purpose,d.interaction,d.compatibility[$('format').value],...d.limitations,d.implementation_note]){const p=document.createElement('p');p.textContent=text;$('detail').append(p)}const a=document.createElement('a');a.href=d.preview;a.target='_blank';a.rel='noopener';a.textContent='Открыть живой пример ↗';$('detail').append(a);const h=document.createElement('h3');h.textContent='Описание для воспроизведения';$('detail').append(h);const pre=document.createElement('pre');pre.textContent=JSON.stringify({id:d.id,source_files:d.source_files,dependencies:d.dependencies,data:d.data,implementation_note:d.implementation_note},null,2);$('detail').append(pre);$('detail').scrollIntoView({behavior:'smooth'})}
function compare(d){if(comparison.some(x=>x.id===d.id))comparison=comparison.filter(x=>x.id!==d.id);else{if(comparison.length===2)comparison.shift();comparison.push(d)}$('compare').replaceChildren();comparison.forEach(x=>{const block=document.createElement('section'),h=document.createElement('h2'),frame=document.createElement('iframe'),close=document.createElement('button');h.textContent=x.title;frame.src=x.preview;frame.title=x.title;close.textContent='Убрать из сравнения';close.onclick=()=>compare(x);block.append(h,close,frame);$('compare').append(block)});$('compare').scrollIntoView({behavior:'smooth'})}
function render(){const q=$('query').value.toLowerCase(),task=$('task').value;const selected=data.entries.filter(d=>(!task||d.tasks.includes(task))&&[d.title,d.purpose,d.interaction,d.id].join(' ').toLowerCase().includes(q));$('count').textContent=selected.length+' из '+data.entries.length+' приёмов';$('format-note').textContent=data.formats[$('format').value];$('list').replaceChildren();selected.forEach(d=>{const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=d.title;const p=document.createElement('p');p.textContent=d.purpose;const sub=document.createElement('p');sub.textContent=d.tasks.join(' · ');const actions=document.createElement('div');actions.className='actions';const detail=document.createElement('button');detail.textContent='Применимость';detail.onclick=()=>show(d);const comparison=document.createElement('button');comparison.textContent='Сравнить';comparison.onclick=()=>compare(d);actions.append(detail,comparison);card.append(h,p,sub,actions);$('list').append(card)})}
fetch('catalog.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;[...new Set(d.entries.flatMap(e=>e.tasks))].sort().forEach(t=>$('task').append(new Option(t,t)));render()}).catch(()=>$('count').textContent='Каталог не загрузился. Откройте через GitHub Pages или локальный сервер.');['query','task','format'].forEach(id=>$(id).addEventListener('input',()=>{render();$('detail').hidden=true}));
</script></html>
