<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Язык презентаций</title><style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;color:#232832;margin:0;background:#fff}main{max-width:1100px;margin:auto;padding:24px}a,h1,h2{color:#062a5f}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:12px;border:1px solid #c9ced6;background:#e8eef8;color:#062a5f;border-radius:8px;cursor:pointer}.slide{padding:32px;border:1px solid #e5e5e5;border-radius:12px;min-height:350px;background:#f8f9fa;overflow:hidden}.slide-content{transition:transform .65s,opacity .65s,clip-path .65s}.metric{font-size:70px;color:#144696}.cols{display:flex;gap:24px;flex-wrap:wrap}.cols p{flex:1;min-width:130px;background:#e8eef8;padding:20px;border-radius:8px}strong{font-size:28px}.bars{height:270px;display:flex;align-items:flex-end;gap:25px}.bars>div{display:grid;gap:8px;text-align:center}.bars span{display:block;background:#144696;width:50px;max-height:200px}table{border-collapse:collapse;width:100%}td,th{padding:18px;text-align:left;border-bottom:1px solid #c9ced6}p{line-height:1.6}#list{display:flex;gap:8px;flex-wrap:wrap}#list button[aria-pressed=true]{background:#144696;color:white}.out{opacity:0}.zoom.out{transform:scale(1.4)}.shared.out{transform:translateX(30px)}.reorder.out{transform:translateY(-25px)}.wipe.out{clip-path:inset(0 100% 0 0)}.focus.out{transform:scale(.8)}.cascade.out{transform:translateY(35px)}@media(prefers-reduced-motion:reduce){.slide-content{transition:none}}@media(max-width:500px){main{padding:16px}.slide{padding:20px}.metric{font-size:54px}}</style><main><a href="./">← Дашборд</a><h1>Язык презентаций</h1><p>18 собственных примеров: композиции, переходы и истории из данных. Значения учебные.</p><div class="controls"><select id="category" aria-label="Каталог"><option>Композиции</option><option>Переходы</option><option>Истории данных</option></select></div><div id="list"></div><h2 id="title"></h2><p id="purpose"></p><div class="slide"><div id="content" class="slide-content"></div></div><div class="controls"><button id="prev">Исходное состояние</button><button id="next">Следующее состояние</button><button id="replay">Повторить переход</button></div><p id="status" aria-live="polite"></p><p id="limit"></p><p>HTML: живой переход. PowerPoint: отдельная реализация или видео. PDF: статичный кадр. Текст и HTML доступны в <a href="presentation-patterns.json">описании примеров</a>.</p><a href="SOURCES-LICENSES.md">Источники и лицензии</a></main><script>
let patterns=[],selected,step=0,timer;const $=id=>document.getElementById(id);function render(){clearTimeout(timer);step=0;const list=patterns.filter(p=>p.category===$('category').value);$('list').replaceChildren();list.forEach(p=>{const b=document.createElement('button');b.textContent=p.title;b.setAttribute('aria-pressed',p.id===selected?.id);b.onclick=()=>{selected=p;render()};$('list').append(b)});if(!selected||selected.category!==$('category').value)selected=list[0];$('title').textContent=selected.title;$('purpose').textContent=selected.purpose;$('limit').textContent='Ограничение: '+selected.limit;show(0,false)}function show(n,animate=true){clearTimeout(timer);const el=$('content'),id=selected.id;step=n;if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){el.className='slide-content '+(selected.effect||'shared')+' out';timer=setTimeout(()=>{if(selected.id!==id)return;el.innerHTML=selected.states[n];el.classList.remove('out');$('status').textContent='Состояние '+(n+1)+' из 2'},650)}else{el.className='slide-content '+(selected.effect||'shared');el.innerHTML=selected.states[n];$('status').textContent='Состояние '+(n+1)+' из 2'}}$('prev').onclick=()=>show(0);$('next').onclick=()=>show(1);$('replay').onclick=()=>{show(0,false);show(1,true)};$('category').onchange=()=>{selected=null;render()};fetch('presentation-patterns.json').then(r=>r.json()).then(d=>{patterns=d;selected=patterns.find(p=>p.id===new URLSearchParams(location.search).get("id"));if(selected)$("category").value=selected.category;render()}).catch(()=>$('status').textContent='Откройте через GitHub Pages или локальный сервер.');
</script></html>
