<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="brand-fonts.css"><title>Язык презентаций</title><style>*{box-sizing:border-box}body{font:16px "Golos Text",Arial,sans-serif;color:#232832;margin:0;background:#fff}main{max-width:1100px;margin:auto;padding:24px}a,h1,h2{color:#062a5f}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:12px;border:1px solid #c9ced6;background:#e8eef8;color:#062a5f;border-radius:8px;cursor:pointer}.slide{padding:32px;border:1px solid #e5e5e5;border-radius:12px;min-height:350px;background:#f8f9fa;overflow:hidden}.slide-content{transition:transform .65s,opacity .65s,clip-path .65s}.metric{font-size:70px;color:#144696}.cols{display:flex;gap:24px;flex-wrap:wrap}.cols p{flex:1;min-width:130px;background:#e8eef8;padding:20px;border-radius:8px}strong{font-size:28px}.bars{height:270px;display:flex;align-items:flex-end;gap:25px}.bars>div{display:grid;gap:8px;text-align:center}.bars span{display:block;background:#144696;width:50px;max-height:200px}table{border-collapse:collapse;width:100%}td,th{padding:18px;text-align:left;border-bottom:1px solid #c9ced6}p{line-height:1.6}#list{display:flex;gap:8px;flex-wrap:wrap}#list button[aria-pressed=true]{background:#144696;color:white}.out{opacity:0}.zoom.out{transform:scale(1.4)}.shared.out{transform:translateX(30px)}.reorder.out{transform:translateY(-25px)}.wipe.out{clip-path:inset(0 100% 0 0)}.focus.out{transform:scale(.8)}.cascade.out{transform:translateY(35px)}@media(prefers-reduced-motion:reduce){.slide-content{transition:none}}@media(max-width:500px){main{padding:16px}.slide{padding:20px}.metric{font-size:54px}} .slide{position:relative;min-height:430px;background:white;border:1px solid #99c2ff;box-shadow:0 12px 35px #062a5f08}.slide-content{min-height:340px;transition:none}.transition-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tile{background:#e8eef8;border-radius:12px;padding:24px;min-height:140px;color:#062a5f}.tile b{font-size:24px}.tile p{margin-bottom:0}.focus-result{display:flex;justify-content:center;margin:20px 0}.focus-result .tile{width:65%;min-height:210px;font-size:26px;background:#144696;color:white}.stack{display:flex;height:90px;gap:4px}.stack span{display:grid;place-items:center;background:#144696;color:white}.stack span:nth-child(2){background:#99c2ff;color:#062a5f}.stack span:nth-child(3){background:#98a8f8;color:#062a5f}#steps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#steps button[aria-current=step]{background:#144696;color:white}.comparison-note{background:#e8eef8;padding:16px;border-radius:8px}.flip-copy{position:absolute;z-index:4;pointer-events:none;margin:0!important} @media(max-width:600px){.transition-grid{grid-template-columns:1fr}.tile{min-height:90px;padding:16px}.focus-result .tile{width:100%}.slide{min-height:440px}.bars{gap:12px}.bars span{width:40px}}
</style><main><a href="./">← Дашборд</a><h1>Язык презентаций</h1><p>18 приёмов: смотрите, как меняется композиция, перемещаются объекты и раскрывается история. Все данные учебные.</p><div class="controls"><select id="category" aria-label="Каталог"><option>Композиции</option><option>Переходы</option><option>Истории данных</option></select></div><div id="list"></div><h2 id="title"></h2><p id="purpose"></p><div id="steps" aria-label="Шаги примера"></div><div class="slide"><div id="content" class="slide-content"></div></div><div class="controls"><button id="prev">Исходное состояние</button><button id="next">Следующее состояние</button><button id="replay">Повторить весь пример</button></div><p id="status" aria-live="polite"></p><p id="limit"></p><p>HTML: живой переход. PowerPoint: отдельная реализация или видео. PDF: статичный кадр. Текст и HTML доступны в <a href="presentation-patterns.json">описании примеров</a>.</p><a href="SOURCES-LICENSES.md">Источники и лицензии</a></main><script src="presentation-patterns.js"></script></html>
