<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSAP · Живой пример</title><link rel="stylesheet" href="brand-fonts.css"><link rel="stylesheet" href="demo.css"><link rel="stylesheet" href="brand-demos.css"></head><body><main id="scene"></main><script src="vendor/gsap.min.js"></script><script src="demos.js"></script><script src="charts.js"></script><script src="stories.js"></script><script src="ideas.js"></script><script>
const q=s=>document.querySelector(s),qa=s=>Array.from(document.querySelectorAll(s));
function wire(animation){window.demoAnimation=animation;window.demoPlay=()=>animation.restart();}
function report(type,extra={}){parent.postMessage({type,id:demo?.id,...extra},location.origin);}
if(new URLSearchParams(location.search).get('compact'))document.body.classList.add('compact');
let demo=DEMOS.find(d=>d.id===new URLSearchParams(location.search).get('id'))||DEMOS[0];
async function load(name){const files={'@pixi':'pixi.min.js','@easel':'easeljs.min.js','@react':'react-demo.js'};const src='vendor/'+(files[name]||name+'.min.js');await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(Error('Не загрузилась библиотека '+name));document.head.appendChild(s);});if(!name.startsWith('@')&&window[name])gsap.registerPlugin(window[name]);}
window.addEventListener('error',e=>{report('demo-error',{message:e.message});});
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;try{if(e.data.action==='play'){gsap.globalTimeline.resume();window.demoPlay?.();}if(e.data.action==='speed')gsap.globalTimeline.timeScale(e.data.value);if(e.data.action==='freeze')gsap.globalTimeline.pause();if(e.data.action==='unfreeze')gsap.globalTimeline.resume();if(e.data.action==='pause')window.demoAnimation?.pause();if(e.data.action==='reverse')window.demoAnimation?.reverse();}catch(error){report('demo-error',{message:error.message});}});
(async()=>{try{if(demo.id.startsWith('story-'))document.body.classList.add('story-mode');q('#scene').innerHTML=demo.html;for(const name of demo.plugins)await load(name);await demo.run();if(demo.id.startsWith('story-')){const animation=window.demoAnimation,seek=q('.scene-seek');if(animation&&seek){const previous=animation.eventCallback('onUpdate');animation.eventCallback('onUpdate',()=>{if(previous)previous.call(animation);seek.value=animation.progress();});seek.oninput=e=>animation.progress(+e.target.value).pause();}if(q('.local-play'))q('.local-play').onclick=()=>window.demoPlay?.();if(q('.local-pause'))q('.local-pause').onclick=()=>animation?.pause();}window.demoReady=true;report('demo-ready');if(demo.id.startsWith('story-')){const measure=()=>report('demo-height',{height:Math.ceil(q('#scene').getBoundingClientRect().height)+4});new ResizeObserver(measure).observe(q('#scene'));measure();}}catch(error){q('#scene').innerHTML='<p class="demo-error"></p>';q('.demo-error').textContent='Не удалось запустить пример: '+error.message;window.demoFailure=error.message;report('demo-error',{message:error.message});}})();
</script></body></html>
